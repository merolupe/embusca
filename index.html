<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>embusca — art search across museums</title>
<style>
  /* ============================================================
     embusca — modern soft minimalism: square edges, generous
     whitespace, light hairlines, black reserved for type & actions
     ============================================================ */
  :root {
    --ink: #111;
    --dim: #757570;
    --hair: #e6e5e1;      /* soft hairline */
    --hard: #111;         /* hard edge, used sparingly */
    --accent: #8b1a1a;    /* museum label */
    --paper: #f6f5f2;     /* image well */
    --bg: #fff;
    --ok: #1a5c1a;
    --shadow: 0 10px 32px rgba(20,20,20,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Tiempos Text", "Charter", "Cambria", "Constantia", Georgia, serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--hard); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Header / search ---------- */
  header { padding: 36px 40px 22px; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--hair); }
  h1 { font-weight: 800; font-size: 34px; letter-spacing: -0.5px; line-height: 1; }
  .search-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
  #q {
    flex: 1 1 300px; max-width: 460px;
    border: 1px solid var(--hard);
    background: var(--bg); color: var(--ink);
    padding: 10px 14px; font-size: 16px; font-family: inherit;
    border-radius: 0; outline: none;
  }
  #q:focus { box-shadow: 0 0 0 1px var(--hard); }
  button.go {
    background: var(--hard); color: var(--bg);
    border: 1px solid var(--hard);
    padding: 10px 26px; font-size: 15px; font-weight: 700; font-family: inherit;
    border-radius: 0; cursor: pointer;
  }
  button.go:hover, button.go:focus { background: #333; outline: none; }
  .sources { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; align-items: center; color: var(--dim); }
  .sources label { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; white-space: nowrap; }
  .sources label:hover { color: var(--ink); }
  .sources input { accent-color: var(--ink); }

  /* ---------- Status line ---------- */
  #status { padding: 14px 40px 0; font-size: 13px; color: var(--dim); display: flex; gap: 18px; flex-wrap: wrap; min-height: 18px; }
  .src-chip b { font-weight: 700; color: var(--ink); }
  .src-chip.err { color: var(--accent); }

  /* ---------- Feature 1: context panel ---------- */
  #context { margin: 18px 40px 0; border: 1px solid var(--hair); display: grid; grid-template-columns: 132px minmax(0, 1fr); }
  #context.noimg { grid-template-columns: minmax(0, 1fr); }
  .ctx-media { background: var(--paper); border-right: 1px solid var(--hair); overflow: hidden; }
  .ctx-media img { width: 100%; height: 100%; min-height: 150px; object-fit: cover; display: block; }
  .ctx-main { padding: 16px 20px 16px; min-width: 0; }
  .ctx-kind { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); }
  .ctx-kind a { color: inherit; }
  .ctx-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-top: 4px; line-height: 1.2; }
  .ctx-sub { font-weight: 400; color: var(--dim); font-size: 15px; font-style: italic; margin-left: 6px; }
  .ctx-desc { color: var(--dim); font-size: 14px; margin-top: 3px; }
  .ctx-summary { font-size: 14px; line-height: 1.55; margin-top: 10px; max-width: 78ch; }
  .ctx-summary a { color: var(--dim); white-space: nowrap; }
  .ctx-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
  .ctx-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin-right: 4px; }
  .chip {
    font: inherit; font-size: 13px; padding: 4px 10px; background: var(--bg); color: var(--ink);
    border: 1px solid var(--hair); cursor: pointer; border-radius: 0;
  }
  .chip:hover { border-color: var(--hard); }
  .chip small { color: var(--dim); }

  /* ---------- Toolbar: counts + view toggle ---------- */
  #toolbar { padding: 18px 40px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--dim); }
  .toggle { display: inline-flex; border: 1px solid var(--hard); }
  .toggle button { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 16px; background: var(--bg); color: var(--ink); border: 0; cursor: pointer; }
  .toggle button[aria-pressed="true"] { background: var(--hard); color: var(--bg); }

  /* ---------- Results grid ---------- */
  main { padding: 22px 40px 30px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
  @media (max-width: 800px)  { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 480px)  { .grid { grid-template-columns: 1fr; } }
  .card {
    border: 1px solid var(--hair); background: var(--bg); cursor: pointer;
    display: flex; flex-direction: column;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .card:hover, .card:focus-visible { box-shadow: var(--shadow); transform: translateY(-2px); border-color: #d5d4d0; }
  .thumb-wrap { aspect-ratio: 4 / 5; background: var(--paper); overflow: hidden; }
  .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb-wrap.noimg {
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--dim); font-style: italic; font-size: 12px; padding: 14px; line-height: 1.5;
  }
  .card-info { padding: 13px 15px 14px; display: flex; gap: 10px; justify-content: space-between; border-top: 1px solid var(--hair); }
  .ci-left { min-width: 0; }
  .card-title {
    font-size: 15px; font-weight: 700; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-artist { color: var(--ink); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-year { color: var(--dim); font-size: 12px; margin-top: 2px; font-style: italic; }
  .ci-right { flex: 0 0 auto; text-align: right; max-width: 96px; }
  .ci-right .flag { width: 28px; height: 19px; object-fit: cover; display: inline-block; }
  .card-museum { color: var(--accent); font-size: 11px; font-weight: 700; margin-top: 5px; line-height: 1.25; }
  .empty, .loading-box { grid-column: 1 / -1; text-align: center; color: var(--dim); padding: 70px 0; font-size: 15px; font-style: italic; }
  .loading-bar { width: 200px; height: 3px; margin: 0 auto 16px; background: var(--hair); position: relative; overflow: hidden; }
  .loading-bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: -30%; width: 30%; background: var(--ink); animation: slide 1.1s linear infinite; }
  @keyframes slide { to { left: 100%; } }

  /* ---------- Less related results ---------- */
  #weak { margin-top: 40px; border-top: 1px solid var(--hair); padding-top: 18px; }
  #weak > summary { cursor: pointer; font-size: 14px; color: var(--dim); list-style: none; }
  #weak > summary::-webkit-details-marker { display: none; }
  #weak > summary::before { content: "＋ "; }
  #weak[open] > summary::before { content: "－ "; }
  #weak > summary b { color: var(--ink); }
  #weakGrid { margin-top: 18px; }
  #weakGrid .card { opacity: .82; }

  /* ---------- Feature 2: timeline ---------- */
  .tl { position: relative; padding-left: 26px; }
  .tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 1px; background: var(--hair); }
  .tl-group { position: relative; margin-bottom: 30px; }
  .tl-group::before { content: ""; position: absolute; left: -24px; top: 7px; width: 9px; height: 9px; background: var(--hard); }
  .tl-label { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; display: flex; gap: 10px; align-items: baseline; }
  .tl-label small { font-size: 12px; font-weight: 400; color: var(--dim); font-style: italic; }
  .tl-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 14px; margin-top: 12px; }
  .tl-card { border: 1px solid var(--hair); cursor: pointer; background: var(--bg); transition: box-shadow .15s ease, border-color .15s ease; }
  .tl-card:hover, .tl-card:focus-visible { box-shadow: var(--shadow); border-color: #d5d4d0; }
  .tl-card .tl-im { aspect-ratio: 1; background: var(--paper); overflow: hidden; }
  .tl-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tl-cap { font-size: 11px; line-height: 1.35; padding: 6px 7px 7px; }
  .tl-cap b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 700; }
  .tl-cap span { color: var(--dim); font-style: italic; }

  /* ---------- Load more / infinite scroll ---------- */
  #more-zone { text-align: center; padding: 6px 40px 60px; }
  #moreBtn {
    background: var(--bg); color: var(--ink); border: 1px solid var(--hard);
    padding: 10px 34px; font-size: 14px; font-weight: 700; font-family: inherit;
    border-radius: 0; cursor: pointer;
  }
  #moreBtn:hover { background: var(--hard); color: var(--bg); }
  #moreBtn.loading { color: var(--dim); border-color: var(--hair); pointer-events: none; }
  #sentinel { height: 1px; }

  /* ---------- Detail view ---------- */
  #overlay { position: fixed; inset: 0; background: rgba(250,250,249,.82); backdrop-filter: blur(6px); display: none; z-index: 100; overflow-y: auto; padding: 5vh 4vw; }
  #overlay.open { display: block; }
  .modal { max-width: 1200px; margin: 0 auto; background: var(--bg); border: 1px solid var(--hair); box-shadow: 0 24px 80px rgba(20,20,20,.18); position: relative; }
  #modalClose {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    background: var(--bg); color: var(--ink); border: 1px solid var(--hair);
    width: 34px; height: 34px; font-size: 16px; cursor: pointer; font-family: inherit; line-height: 1;
  }
  #modalClose:hover { background: var(--hard); color: var(--bg); border-color: var(--hard); }
  .modal-body { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); }
  @media (max-width: 900px) { .modal-body { grid-template-columns: 1fr; } }
  .modal-img { background: var(--paper); display: flex; align-items: center; justify-content: center; min-height: 320px; position: relative; }
  .modal-img img { max-width: 100%; max-height: 86vh; display: block; }
  .modal-img .noimg { color: var(--dim); font-style: italic; font-size: 13px; text-align: center; padding: 30px; line-height: 1.6; }
  .imgnote {
    position: absolute; bottom: 10px; right: 12px; font-size: 11px;
    color: var(--ink); background: rgba(255,255,255,.9); padding: 3px 9px; font-style: italic;
  }
  .modal-info { padding: 34px 30px 30px; }
  .modal-info h2 { font-weight: 700; font-size: 24px; line-height: 1.22; letter-spacing: -0.3px; padding-right: 26px; }
  .modal-artist { color: var(--dim); font-size: 15px; margin-top: 7px; font-style: italic; }
  .facts { margin-top: 20px; }
  .fact { display: flex; gap: 14px; padding: 6px 0; font-size: 14px; }
  .fact .k { flex: 0 0 84px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; padding-top: 3px; }
  .fact .v { flex: 1; line-height: 1.5; }
  .fact .v .flag { width: 24px; height: 16px; object-fit: cover; vertical-align: -3px; margin-right: 7px; }
  .fact.why .v { color: var(--ok); }
  .modal-actions { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; }
  .modal-actions a {
    font-size: 13px; padding: 9px 16px; cursor: pointer; font-weight: 700;
    border: 1px solid var(--hard); background: var(--bg); color: var(--ink); text-decoration: none;
  }
  .modal-actions a:hover { background: var(--hard); color: var(--bg); }

  /* ---------- Suggestions ---------- */
  .suggest { margin-top: 26px; }
  .sg-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--dim); margin-bottom: 10px; }
  .sg-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sg-item { cursor: pointer; border: 1px solid var(--hair); background: var(--bg); transition: box-shadow .15s ease, border-color .15s ease; }
  .sg-item:hover, .sg-item:focus-visible { box-shadow: var(--shadow); border-color: #d5d4d0; }
  .sg-item .sg-im { aspect-ratio: 1; background: var(--paper); overflow: hidden; }
  .sg-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sg-cap { font-size: 11px; line-height: 1.35; padding: 6px 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---------- Diagnostics ---------- */
  #diag { margin: 16px 40px 0; border: 1px solid var(--hair); display: none; }
  #diag.show { display: block; }
  #diag-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--hair); font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
  #diagClose { background: none; border: none; font-size: 15px; cursor: pointer; color: var(--dim); font-family: inherit; }
  #diagClose:hover { color: var(--ink); }
  #diag-body { padding: 14px 16px; font-size: 13px; overflow-x: auto; }
  #diag table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  #diag th, #diag td { border: 1px solid var(--hair); padding: 5px 9px; text-align: left; font-weight: 400; vertical-align: top; }
  #diag th { background: var(--paper); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  #diag .fail { color: var(--accent); }
  #diag .warn { color: #8a5a00; }
  #diag .oklbl { color: var(--ok); }
  #diag ul { margin: 6px 0 0 20px; }
  footer { padding: 4px 40px 28px; text-align: right; }
  footer button { background: none; border: none; color: #c9c8c4; cursor: pointer; font: inherit; font-size: 12px; padding: 0; }
  footer button:hover { color: var(--dim); text-decoration: underline; }

  @media (max-width: 600px) {
    header, #status, #toolbar, main, #more-zone, footer { padding-left: 16px; padding-right: 16px; }
    #context, #diag { margin-left: 16px; margin-right: 16px; }
    #context { grid-template-columns: 88px minmax(0, 1fr); }
    #status { gap: 4px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>embusca</h1>
  <div class="search-row" role="search">
    <input id="q" type="search" placeholder="Artist, subject or style — in English or Portuguese" autocomplete="off" autofocus aria-label="Search artworks">
    <button class="go" id="goBtn">Search</button>
    <div class="sources" aria-label="Collections">
      <label><input type="checkbox" id="src-met" checked> The Met</label>
      <label><input type="checkbox" id="src-aic" checked> Art Inst. Chicago</label>
      <label><input type="checkbox" id="src-cma" checked> Cleveland</label>
      <label><input type="checkbox" id="src-vam" checked> V&amp;A</label>
      <label><input type="checkbox" id="src-smk" checked> SMK</label>
      <label><input type="checkbox" id="src-wmc" checked> Wikimedia</label>
      <label><input type="checkbox" id="src-wel" checked> Wellcome</label>
    </div>
  </div>
</header>

<div id="status" aria-live="polite"></div>

<section id="context" hidden aria-label="What embusca understood"></section>

<div id="diag">
  <div id="diag-head"><span>DIAGNOSTICS — RELEVANCE SUITE</span><button id="diagClose" title="Close">×</button></div>
  <div id="diag-body">Running test searches…</div>
</div>

<div id="toolbar" hidden>
  <span id="count"></span>
  <div class="toggle" role="group" aria-label="View">
    <button type="button" data-view="grid" aria-pressed="true">Grid</button>
    <button type="button" data-view="timeline" aria-pressed="false">Timeline</button>
  </div>
</div>

<main>
  <div id="grid" class="grid"></div>
  <div id="timeline" hidden></div>
  <details id="weak" hidden>
    <summary>Less related results (<b id="weakCount">0</b>) — matched only loosely, shown for completeness</summary>
    <div id="weakGrid" class="grid"></div>
  </details>
</main>
<div id="more-zone"><button id="moreBtn" hidden>Load more</button></div>
<div id="sentinel"></div>

<footer><button id="diagBtn">run diagnostics</button></footer>

<div id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button id="modalClose" title="Close" aria-label="Close">×</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/lexicon.js"></script>
<script src="js/intent.js"></script>
<script src="js/sources.js"></script>
<script src="js/rank.js"></script>
<script src="js/search.js"></script>
<script src="js/suite.js"></script>
<script src="js/app.js"></script>
</body>
</html>
